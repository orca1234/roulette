<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>룰렛</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-indigo-500 selection:text-white">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-950/70 backdrop-blur sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-indigo-500 to-violet-500 flex items-center justify-center font-bold text-white shadow-md shadow-indigo-500/20">
          R
        </div>
        <h1 class="text-lg sm:text-xl font-bold tracking-tight text-white">커스텀 룰렛 추첨기</h1>
      </div>
      <div class="flex items-center space-x-2">
        <button id="resetDefaultsBtn" class="text-xs sm:text-sm px-3 py-1.5 rounded-lg border border-slate-700 bg-slate-800/80 hover:bg-slate-700 text-slate-300 hover:text-white transition-colors duration-150 font-medium">
          기본값 복원
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
    
    <!-- Left Column: Wheel Display and Trigger -->
    <section class="lg:col-span-7 flex flex-col items-center justify-center bg-slate-950/40 p-4 sm:p-8 rounded-2xl border border-slate-800/80 shadow-2xl relative">
      
      <!-- Top Center Pin Indicator -->
      <div class="relative w-full flex justify-center mb-[-14px] z-20">
        <div class="w-0 h-0 border-l-[14px] border-l-transparent border-r-[14px] border-r-transparent border-t-[28px] border-t-amber-400 drop-shadow-[0_4px_6px_rgba(245,158,11,0.5)]"></div>
      </div>

      <!-- Roulette Canvas Wrapper -->
      <div id="canvasContainer" class="relative w-full max-w-[460px] aspect-square flex items-center justify-center">
        <canvas id="rouletteCanvas" class="w-full h-full rounded-full shadow-2xl"></canvas>
        
        <!-- Center Hub Pin -->
        <div class="absolute w-14 h-14 rounded-full bg-slate-900 border-4 border-slate-700 shadow-inner flex items-center justify-center pointer-events-none z-10">
          <div class="w-4 h-4 rounded-full bg-indigo-500 shadow-md shadow-indigo-500/50"></div>
        </div>
      </div>

      <!-- Controls below Canvas -->
      <div class="w-full max-w-xs mt-8 flex flex-col items-center gap-3">
        <button id="spinBtn" class="w-full py-4 px-6 rounded-xl font-extrabold text-lg text-white bg-gradient-to-r from-indigo-500 via-indigo-600 to-violet-600 hover:from-indigo-600 hover:via-indigo-700 hover:to-violet-700 active:scale-[0.98] transition-all duration-200 shadow-lg shadow-indigo-500/30 ring-2 ring-indigo-400/20 disabled:opacity-50 disabled:cursor-not-allowed">
          돌리기 (SPIN)
        </button>

        <p class="text-xs text-slate-400 text-center font-normal">
          스페이스바를 누르거나 버튼을 클릭하여 돌릴 수 있습니다.
        </p>
      </div>

      <!-- Quick Winner Highlight Banner -->
      <div id="quickResultCard" class="w-full max-w-md mt-6 hidden p-4 rounded-xl border border-indigo-500/30 bg-indigo-950/40 text-center animate-fade-in">
        <span class="text-xs uppercase tracking-wider text-indigo-400 font-semibold block mb-1">최근 당첨 결과</span>
        <div id="quickResultText" class="text-2xl font-bold text-white tracking-wide"></div>
      </div>
    </section>

    <!-- Right Column: Settings & Item Management Panel -->
    <section class="lg:col-span-5 flex flex-col bg-slate-950/60 rounded-2xl border border-slate-800 p-6 shadow-xl space-y-6">
      
      <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <div>
          <h2 class="text-lg font-bold text-white">항목관리</h2>
        </div>
        <span id="totalItemsBadge" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/30">
          총 0개
        </span>
      </div>

      <!-- Add New Item Row -->
      <div class="space-y-2">
        <label class="text-xs font-semibold text-slate-300">추가</label>
        <div class="flex gap-2">
          <input 
            type="text" 
            id="newItemInput" 
            placeholder="이름 입력" 
            maxlength="20"
            class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3.5 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
          />
          <input 
            type="number" 
            id="newWeightInput" 
            value="1" 
            min="1" 
            max="100" 
            title="칸 개수"
            class="w-20 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white text-center focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition"
          />
          <button 
            id="addItemBtn" 
            class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-lg text-sm transition-colors whitespace-nowrap shadow-sm">
            추가
          </button>
        </div>
      </div>

      <!-- Item List Container -->
      <div class="space-y-2 flex-1">
        <div class="flex justify-between items-center text-xs font-semibold text-slate-400 px-1">
          <span>이름</span>
          <span class="mr-14">칸 개수</span>
        </div>

        <div id="itemList" class="custom-scrollbar space-y-2 max-h-[360px] overflow-y-auto pr-1">
          <!-- Populated dynamically via JS -->
        </div>
      </div>

      <!-- Quick Action Utilities -->
      <div class="pt-4 border-t border-slate-800/80 flex justify-between items-center gap-2">
        <button id="shuffleColorsBtn" class="text-xs px-3 py-2 rounded-lg bg-slate-900 hover:bg-slate-850 text-slate-300 border border-slate-700 transition font-medium">
          색상 재배열
        </button>
        <button id="clearAllBtn" class="text-xs px-3 py-2 rounded-lg bg-red-950/30 hover:bg-red-900/40 text-red-400 border border-red-900/50 transition font-medium">
          전체 삭제
        </button>
      </div>

    </section>

  </main>

  <!-- Winner Modal Popup -->
  <div id="resultModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm hidden opacity-0 transition-opacity duration-200">
    <div class="bg-slate-900 border border-slate-700/80 rounded-2xl max-w-sm w-full p-6 text-center shadow-2xl transform scale-95 transition-transform duration-200" id="modalCard">
      <div class="w-12 h-12 mx-auto mb-4 rounded-full bg-indigo-500/20 border border-indigo-500/40 flex items-center justify-center">
        <span class="text-indigo-400 font-bold text-xl">67</span>
      </div>
      <p class="text-xs uppercase tracking-widest text-slate-400 font-semibold mb-1">결과</p>
      <h3 id="modalWinnerTitle" class="text-2xl font-black text-white mb-6 break-words tracking-tight"></h3>
      
      <div class="flex gap-2">
        <button id="modalCloseBtn" class="flex-1 py-2.5 px-4 rounded-xl font-semibold text-sm bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 transition">
          확인
        </button>
        <button id="modalSpinAgainBtn" class="flex-1 py-2.5 px-4 rounded-xl font-semibold text-sm bg-indigo-600 hover:bg-indigo-500 text-white transition shadow-lg shadow-indigo-600/30">
          다시 돌리기
        </button>
      </div>
    </div>
  </div>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-6 right-6 z-50 bg-slate-800 border border-slate-700 text-white text-xs px-4 py-2.5 rounded-lg shadow-xl opacity-0 pointer-events-none transition-opacity duration-200">
    메시지
  </div>

  <script>
    // Distinct aesthetic palette suited for dark UI contrast
    const COLOR_PALETTE = [
      "#4f46e5", // Indigo
      "#0891b2", // Cyan
      "#059669", // Emerald
      "#d97706", // Amber
      "#e11d48", // Rose
      "#7c3aed", // Violet
      "#2563eb", // Blue
      "#0d9488", // Teal
      "#c026d3", // Fuchsia
      "#ea580c", // Orange
      "#16a34a", // Green
      "#6366f1"  // Light Indigo
    ];

    // Initial default items
    const DEFAULT_ITEMS = [
      
    ];

    // State  
    let items = JSON.parse(localStorage.getItem("roulette_items")) || [...DEFAULT_ITEMS];
    let nextId = items.reduce((max, item) => Math.max(max, item.id || 0), 0) + 1;

    // Wheel animation states
    let currentRotation = 0; // In radians
    let isSpinning = false;
    let spinVelocity = 0;
    let spinDeceleration = 0.985;
    let animFrameId = null;
    let lastSliceIndex = -1;

    // Audio Context (Synthesized sound - No external assets)
    let audioCtx = null;
    function playTickSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(520, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(140, audioCtx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.04);
      } catch (e) {
        // Audio playback fallback safe
      }
    }

    function playWinSound() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        const now = audioCtx.currentTime;
        const freqs = [330, 440, 554, 659];
        freqs.forEach((freq, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + idx * 0.09);
          gain.gain.setValueAtTime(0.12, now + idx * 0.09);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.25);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + idx * 0.09);
          osc.stop(now + idx * 0.09 + 0.28);
        });
      } catch (e) {}
    }

    // DOM Elements
    const canvas = document.getElementById("rouletteCanvas");
    const ctx = canvas.getContext("2d");
    const spinBtn = document.getElementById("spinBtn");
    const itemListEl = document.getElementById("itemList");
    const newItemInput = document.getElementById("newItemInput");
    const newWeightInput = document.getElementById("newWeightInput");
    const addItemBtn = document.getElementById("addItemBtn");
    const totalItemsBadge = document.getElementById("totalItemsBadge");
    const resetDefaultsBtn = document.getElementById("resetDefaultsBtn");
    const shuffleColorsBtn = document.getElementById("shuffleColorsBtn");
    const clearAllBtn = document.getElementById("clearAllBtn");

    // Modal elements
    const resultModal = document.getElementById("resultModal");
    const modalCard = document.getElementById("modalCard");
    const modalWinnerTitle = document.getElementById("modalWinnerTitle");
    const modalCloseBtn = document.getElementById("modalCloseBtn");
    const modalSpinAgainBtn = document.getElementById("modalSpinAgainBtn");
    const quickResultCard = document.getElementById("quickResultCard");
    const quickResultText = document.getElementById("quickResultText");
    const toast = document.getElementById("toast");

    // Toast feedback helper
    let toastTimeout;
    function showToast(message) {
      clearTimeout(toastTimeout);
      toast.textContent = message;
      toast.classList.remove("opacity-0", "pointer-events-none");
      toastTimeout = setTimeout(() => {
        toast.classList.add("opacity-0", "pointer-events-none");
      }, 2000);
    }

    // Canvas size initialization with devicePixelRatio support
    function resizeCanvas() {
      const container = document.getElementById("canvasContainer");
      const size = Math.min(container.clientWidth, 460);
      const dpr = window.devicePixelRatio || 1;

      canvas.width = size * dpr;
      canvas.height = size * dpr;
      canvas.style.width = size + "px";
      canvas.style.height = size + "px";

      ctx.resetTransform && ctx.resetTransform();
      ctx.scale(dpr, dpr);
      drawWheel();
    }

    // Get total weight sum
    function getTotalWeight() {
      return items.reduce((sum, item) => sum + (Number(item.weight) || 1), 0);
    }

    // Draw Wheel on HTML5 Canvas
    function drawWheel() {
      const size = parseFloat(canvas.style.width) || 400;
      const center = size / 2;
      const radius = center - 8;

      ctx.clearRect(0, 0, size, size);

      if (items.length === 0) {
        // Draw empty state
        ctx.beginPath();
        ctx.arc(center, center, radius, 0, 2 * Math.PI);
        ctx.fillStyle = "#1e293b";
        ctx.fill();
        ctx.strokeStyle = "#334155";
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.fillStyle = "#64748b";
        ctx.font = "bold 15px Pretendard, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText("항목추가", center, center);
        return;
      }

      const totalWeight = getTotalWeight();
      let startAngle = currentRotation;

      // Outer rim
      ctx.beginPath();
      ctx.arc(center, center, radius, 0, 2 * Math.PI);
      ctx.fillStyle = "#0f172a";
      ctx.fill();

      // Draw each slice
      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        const sliceAngle = ((Number(item.weight) || 1) / totalWeight) * 2 * Math.PI;
        const endAngle = startAngle + sliceAngle;

        // Slice wedge
        ctx.beginPath();
        ctx.moveTo(center, center);
        ctx.arc(center, center, radius - 4, startAngle, endAngle);
        ctx.closePath();
        ctx.fillStyle = item.color || COLOR_PALETTE[i % COLOR_PALETTE.length];
        ctx.fill();

        // Slice border divider
        ctx.lineWidth = 1.5;
        ctx.strokeStyle = "rgba(15, 23, 42, 0.6)";
        ctx.stroke();

        // Render label text inside slice
        ctx.save();
        ctx.translate(center, center);
        ctx.rotate(startAngle + sliceAngle / 2);

        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#ffffff";
        
        // Font sizing adjusts relative to item density
        const dynamicFontSize = items.length > 14 ? 12 : items.length > 8 ? 13 : 15;
        ctx.font = `600 ${dynamicFontSize}px Pretendard, sans-serif`;
        ctx.shadowColor = "rgba(0,0,0,0.4)";
        ctx.shadowBlur = 3;

        // Truncate long names to fit canvas radius neatly
        let displayName = item.name;
        if (displayName.length > 10) {
          displayName = displayName.substring(0, 9) + "...";
        }
        ctx.fillText(displayName, radius - 24, 0);

        ctx.restore();
        startAngle = endAngle;
      }

      // Outer ring border
      ctx.beginPath();
      ctx.arc(center, center, radius - 2, 0, 2 * Math.PI);
      ctx.lineWidth = 6;
      ctx.strokeStyle = "#1e293b";
      ctx.stroke();
    }

    // Determine slice at 12 o'clock pointer
    function getPointerSliceIndex() {
      if (items.length === 0) return -1;
      const totalWeight = getTotalWeight();
      
      // Pointer is fixed at top: 270 degrees or (1.5 * PI)
      const pointerAngle = 1.5 * Math.PI;
      
      // Normalize rotation between 0 and 2*PI
      const normalizedRot = (currentRotation % (2 * Math.PI) + (2 * Math.PI)) % (2 * Math.PI);
      
      // Angle inside the relative wheel coordinate
      let relativeAngle = (pointerAngle - normalizedRot) % (2 * Math.PI);
      if (relativeAngle < 0) relativeAngle += 2 * Math.PI;

      let accumulated = 0;
      for (let i = 0; i < items.length; i++) {
        const sliceAngle = ((Number(items[i].weight) || 1) / totalWeight) * 2 * Math.PI;
        if (relativeAngle >= accumulated && relativeAngle < accumulated + sliceAngle) {
          return i;
        }
        accumulated += sliceAngle;
      }
      return 0;
    }

    // Physics Animation Loop
    function spinLoop() {
      if (!isSpinning) return;

      currentRotation += spinVelocity;
      spinVelocity *= spinDeceleration;

      // Track pointer slice passings for tick sound effect
      const currentSlice = getPointerSliceIndex();
      if (currentSlice !== lastSliceIndex) {
        lastSliceIndex = currentSlice;
        playTickSound();
      }

      drawWheel();

      // Check stopping condition
      if (spinVelocity < 0.002) {
        isSpinning = false;
        spinVelocity = 0;
        cancelAnimationFrame(animFrameId);
        onSpinComplete();
        return;
      }

      animFrameId = requestAnimationFrame(spinLoop);
    }

    // Trigger Spin
    function startSpin() {
      if (isSpinning) return;
      if (items.length < 1) {
        showToast("항목 없음");
        return;
      }

      // Set initial random impulse speed between 0.28 and 0.45 rad/frame
      spinVelocity = Math.random() * 0.18 + 0.28;
      // Slight variation in deceleration adds suspense
      spinDeceleration = 0.984 + Math.random() * 0.004;
      isSpinning = true;
      spinBtn.disabled = true;

      // Ensure AudioContext is unlocked by user click
      playTickSound();

      animFrameId = requestAnimationFrame(spinLoop);
    }

    // Spin Finish Handler
    function onSpinComplete() {
      spinBtn.disabled = false;
      const winnerIdx = getPointerSliceIndex();
      const winner = items[winnerIdx];

      playWinSound();

      // Update Quick Card
      quickResultText.textContent = winner ? winner.name : "-";
      quickResultCard.classList.remove("hidden");

      // Open Result Modal
      modalWinnerTitle.textContent = winner ? winner.name : "";
      openResultModal();
    }

    // Modal Control
    function openResultModal() {
      resultModal.classList.remove("hidden");
      setTimeout(() => {
        resultModal.classList.remove("opacity-0");
        modalCard.classList.remove("scale-95");
      }, 10);
    }

    function closeResultModal() {
      resultModal.classList.add("opacity-0");
      modalCard.classList.add("scale-95");
      setTimeout(() => {
        resultModal.classList.add("hidden");
      }, 200);
    }

    // Save and Render Item List
    function saveAndRefresh() {
      localStorage.setItem("roulette_items", JSON.stringify(items));
      renderItemList();
      drawWheel();
      totalItemsBadge.textContent = `총 ${items.length}개`;
    }

    function renderItemList() {
      itemListEl.innerHTML = "";

      if (items.length === 0) {
        itemListEl.innerHTML = `
          <div class="text-center py-6 text-sm text-slate-500 bg-slate-900/40 rounded-xl border border-dashed border-slate-800">
            항목 없음
          </div>
        `;
        return;
      }

      items.forEach((item, index) => {
        const row = document.createElement("div");
        row.className = "flex items-center gap-2 bg-slate-900/90 border border-slate-800/80 hover:border-slate-700/80 rounded-xl p-2 transition-all group";

        // Color indicator pill
        const colorDot = document.createElement("div");
        colorDot.className = "w-3 h-8 rounded-md shrink-0 shadow-sm";
        colorDot.style.backgroundColor = item.color;

        // Name input (inline edit)
        const nameInput = document.createElement("input");
        nameInput.type = "text";
        nameInput.value = item.name;
        nameInput.maxLength = 24;
        nameInput.className = "flex-1 bg-transparent px-2 py-1 text-sm text-white focus:bg-slate-800 focus:outline-none rounded font-medium transition";
        nameInput.addEventListener("change", (e) => {
          const val = e.target.value.trim();
          item.name = val.length > 0 ? val : `항목 ${index + 1}`;
          saveAndRefresh();
        });

        // Weight/Count input
        const weightInput = document.createElement("input");
        weightInput.type = "number";
        weightInput.value = item.weight || 1;
        weightInput.min = "1";
        weightInput.max = "99";
        weightInput.title = "칸 개수";
        weightInput.className = "w-14 bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-white text-center focus:outline-none focus:ring-1 focus:ring-indigo-500";
        weightInput.addEventListener("change", (e) => {
          let num = parseInt(e.target.value, 10);
          if (isNaN(num) || num < 1) num = 1;
          if (num > 99) num = 99;
          item.weight = num;
          e.target.value = num;
          saveAndRefresh();
        });

        // Delete button
        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "w-8 h-8 flex items-center justify-center text-slate-500 hover:text-red-400 hover:bg-red-950/30 rounded-lg transition-colors text-xs font-semibold";
        delBtn.innerHTML = `
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        `;
        delBtn.addEventListener("click", () => {
          items.splice(index, 1);
          saveAndRefresh();
          showToast("삭제됨");
        });

        row.appendChild(colorDot);
        row.appendChild(nameInput);
        row.appendChild(weightInput);
        row.appendChild(delBtn);

        itemListEl.appendChild(row);
      });
    }

    // Add Item Handler
    function handleAddItem() {
      const name = newItemInput.value.trim();
      let weight = parseInt(newWeightInput.value, 10);

      if (!name) {
        showToast("이름 입력");
        newItemInput.focus();
        return;
      }

      if (isNaN(weight) || weight < 1) {
        weight = 1;
      }

      const assignedColor = COLOR_PALETTE[items.length % COLOR_PALETTE.length];

      items.push({
        id: nextId++,
        name: name,
        weight: weight,
        color: assignedColor
      });

      newItemInput.value = "";
      newWeightInput.value = "1";
      saveAndRefresh();
      showToast(`'${name}' 추가됨`);
      newItemInput.focus();
    }

    // Event Listeners
    addItemBtn.addEventListener("click", handleAddItem);
    newItemInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleAddItem();
    });
    newWeightInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleAddItem();
    });

    spinBtn.addEventListener("click", startSpin);

    // Keyboard trigger (Spacebar)
    window.addEventListener("keydown", (e) => {
      if (e.code === "Space" && e.target.tagName !== "INPUT") {
        e.preventDefault();
        startSpin();
      }
    });

    // Reset Defaults
    resetDefaultsBtn.addEventListener("click", () => {
      items = JSON.parse(JSON.stringify(DEFAULT_ITEMS));
      nextId = 10;
      saveAndRefresh();
      showToast("복구 완료");
    });

    // Shuffle Colors
    shuffleColorsBtn.addEventListener("click", () => {
      const shuffled = [...COLOR_PALETTE].sort(() => Math.random() - 0.5);
      items.forEach((item, idx) => {
        item.color = shuffled[idx % shuffled.length];
      });
      saveAndRefresh();
      showToast("색상 재배열");
    });

    // Clear All
    clearAllBtn.addEventListener("click", () => {
      if (items.length === 0) return;
      items = [];
      saveAndRefresh();
      showToast("제거 완료");
    });

    // Modal Events
    modalCloseBtn.addEventListener("click", closeResultModal);
    resultModal.addEventListener("click", (e) => {
      if (e.target === resultModal) closeResultModal();
    });
    modalSpinAgainBtn.addEventListener("click", () => {
      closeResultModal();
      setTimeout(startSpin, 300);
    });

    // Window Resize Observer for responsive canvas
    window.addEventListener("resize", resizeCanvas);

    // Initial load
    window.onload = function () {
      resizeCanvas();
      renderItemList();
      totalItemsBadge.textContent = `총 ${items.length}개`;
    };
  </script>
</body>
</html>
